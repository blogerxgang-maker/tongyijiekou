providers:
  gemini:
    type: openai-compatible
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    api_key_envs:
      - GEMINI_API_KEY_2
      - GEMINI_API_KEY_3

  nvidia:
    type: openai-compatible
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    api_key_envs:
      - NVIDIA_API_KEY_2
      - NVIDIA_API_KEY_3

models:
  chat-fast:
    owned_by: llm-gateway
    capabilities: [chat]
    primary:
      provider: gemini
      provider_model: gemini-3-flash-preview
    fallback:
      - provider: nvidia
        provider_model: nvidia/llama-3.1-nemotron-nano-8b-v1

  chat-best:
    owned_by: llm-gateway
    capabilities: [chat]
    primary:
      provider: gemini
      provider_model: gemini-3-flash-preview
    fallback:
      - provider: nvidia
        provider_model: nvidia/llama-3.3-nemotron-super-49b-v1

  chat-cheap:
    owned_by: llm-gateway
    capabilities: [chat]
    primary:
      provider: nvidia
      provider_model: nvidia/llama-3.1-nemotron-nano-8b-v1
    fallback:
      - provider: gemini
        provider_model: gemini-3-flash-preview

  embedding-small:
    owned_by: llm-gateway
    capabilities: [embeddings]
    primary:
      provider: nvidia
      provider_model: nvidia/llama-3.2-nemoretriever-1b-vlm-embed-v1
    fallback:
      - provider: gemini
        provider_model: text-embedding-004

auth:
  projects:
    local-dev:
      name: Local Development
      api_key_env: PROJECT_API_KEY
      api_key: dev-project-key
      allowed_models: ["*"]

policies:
  retry_status_codes: [429, 500, 502, 503, 504]
  request_timeout_ms: 60000
